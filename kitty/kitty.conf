# ─────────────────────────────────────────────────────────────
#  Kitty · Darkthrone · tuned for LazyVim + productivity
# ─────────────────────────────────────────────────────────────

# ── Fonts ────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
# Fine-tune spacing: a little extra line height makes code easier to read
adjust_line_height 110%
# Ligatures on (=> -> != === etc). Use "cursor" to disable them under the cursor
disable_ligatures cursor
# Smoother text rendering
text_composition_strategy platform

# ── Colors: Darkthrone (black-metal-theme-neovim) ────────────
foreground              #c1c1c1
background              #000000
selection_foreground    #000000
selection_background    #c1c1c1
url_color               #fbcb97

cursor                  #c1c1c1
cursor_text_color       #000000

color0  #000000
color1  #5f8787
color2  #fbcb97
color3  #e78a53
color4  #888888
color5  #999999
color6  #aaaaaa
color7  #c1c1c1
color8  #333333
color9  #5f8787
color10 #fbcb97
color11 #e78a53
color12 #888888
color13 #999999
color14 #aaaaaa
color15 #c1c1c1

# Search / mark highlights
mark1_foreground #000000
mark1_background #e78a53
mark2_foreground #000000
mark2_background #fbcb97
mark3_foreground #000000
mark3_background #5f8787

# ── Window ───────────────────────────────────────────────────
hide_window_decorations yes
background_opacity      0.92
background_blur         20
dynamic_background_opacity yes

# Breathing room around the text (looks great with Neovim)
window_padding_width    10 14
# Keep Neovim's background seamless with the padding
placement_strategy      center
remember_window_size    no
initial_window_width    120c
initial_window_height   36c
confirm_os_window_close 0

# Dim inactive splits so you always know where focus is
inactive_text_alpha     0.7
window_border_width     1pt
active_border_color     #f5f5f5
inactive_border_color   #6b6b6b
bell_border_color       #fbcb97

# ── Cursor ───────────────────────────────────────────────────
cursor_shape            block
# Let Neovim control cursor shape per mode; no blinking noise
cursor_blink_interval   0
cursor_trail                   3
cursor_trail_start_threshold   2
cursor_trail_decay             0.1 0.4

# ── Tab bar (powerline style) ────────────────────────────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      " {index}: {title[:25]} "
active_tab_foreground   #000000
active_tab_background   #e78a53
active_tab_font_style   bold
inactive_tab_foreground #888888
inactive_tab_background #121212
tab_bar_background      #000000

# ── Layouts (splits first, stack = zoom a pane) ──────────────
enabled_layouts         splits:split_axis=horizontal,stack

# ── Scrollback ───────────────────────────────────────────────
scrollback_lines        20000
scrollback_pager_history_size 100
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 2.0

# ── Mouse & selection ────────────────────────────────────────
mouse_hide_wait         3.0
copy_on_select          clipboard
strip_trailing_spaces   smart
url_style               curly
open_url_with           default
detect_urls             yes
show_hyperlink_targets  yes

# ── Shell & integration ──────────────────────────────────────
shell                   zsh
shell_integration       enabled
# Allows plugins (e.g. smart-splits.nvim, kitty-scrollback.nvim) to talk to kitty
allow_remote_control    socket-only
listen_on               unix:/tmp/kitty-{kitty_pid}
# Needed so Neovim/tmux clipboard (OSC 52) works
clipboard_control       write-clipboard write-primary read-clipboard-ask read-primary-ask

# ── Performance ──────────────────────────────────────────────
repaint_delay           8
input_delay             2
sync_to_monitor         yes

# ── Misc ─────────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.15
update_check_interval   0
term                    xterm-kitty

# ── Keybindings ──────────────────────────────────────────────
kitty_mod ctrl+shift

# Splits
map kitty_mod+\       launch --location=vsplit --cwd=current
map kitty_mod+s       launch --location=hsplit --cwd=current
map kitty_mod+z       toggle_layout stack

# Move between splits (vim-style)
map kitty_mod+h       neighboring_window left
map kitty_mod+l       neighboring_window right
map kitty_mod+k       neighboring_window up
map kitty_mod+j       neighboring_window down

# Resize splits
map kitty_mod+alt+h   resize_window narrower 3
map kitty_mod+alt+l   resize_window wider 3
map kitty_mod+alt+k   resize_window taller 3
map kitty_mod+alt+j   resize_window shorter 3

# Tabs
map kitty_mod+t       new_tab_with_cwd
map kitty_mod+q       close_tab
map kitty_mod+]       next_tab
map kitty_mod+[       previous_tab
map kitty_mod+1       goto_tab 1
map kitty_mod+2       goto_tab 2
map kitty_mod+3       goto_tab 3
map kitty_mod+4       goto_tab 4

# Scrollback in your editor (opens in nvim)
map kitty_mod+f       show_scrollback

# Font size on the fly
map kitty_mod+equal   change_font_size all +1.0
map kitty_mod+minus   change_font_size all -1.0
map kitty_mod+0       change_font_size all 0

# Opacity toggle for focus mode
map kitty_mod+u       set_background_opacity +0.05
map kitty_mod+d       set_background_opacity -0.05
map kitty_mod+o       set_background_opacity 1

# Reload config
map kitty_mod+f5      load_config_file
