# ─────────────────────────────────────────────────────────────
#  tmux · Darkthrone · arrow-segment "riced" look
#  Compatible with tmux 3.2a (no 3.3+ options used)
# ─────────────────────────────────────────────────────────────

# ── Prefix ───────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

# ── Core behavior ────────────────────────────────────────────
set -g mouse on
set -g allow-rename off
set -g automatic-rename off
set -g base-index 1                 # windows start at 1
setw -g pane-base-index 1           # panes start at 1
set -g renumber-windows on          # no gaps after closing a window
set -g history-limit 50000
set -g escape-time 10               # fast <Esc> for Neovim
set -g focus-events on              # lets Neovim detect focus (autoread etc.)
set -g repeat-time 600
set -g display-time 1500
set -g status-interval 2
set -g set-clipboard on
set -g mode-keys vi

# ── True color, undercurl, kitty support ─────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty*:RGB:usstyle:hyperlinks"
set -as terminal-overrides ",xterm-kitty*:Tc"
# Undercurl + colored underlines (LSP diagnostics in LazyVim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Splits (same keys, now open in the current directory) ────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows also keep your current directory
bind c new-window -c "#{pane_current_path}"

# ── Reload config ────────────────────────────────────────────
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message " Config reloaded"

# ── Switch panes using Alt+h/j/k/l ───────────────────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Resize panes (prefix + H/J/K/L, repeatable) ──────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows switching ────────────────────────────────────────
unbind p
bind b previous-window
bind -r n next-window

# ── Copy mode (vi-style) ─────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ─────────────────────────────────────────────────────────────
#  DESIGN — arrow segments, Darkthrone colors
#
#  Color roles (swap these hex values to re-theme everything):
#    ACCENT  #e78a53   session pill, clock, active pane label
#    ACCENT2 #fbcb97   middle arrow step
#    LIGHT   #c1c1c1   active window / host segment (text #000000)
#    MID     #999999   user + host text
#    DARK    #222222   inactive windows / user segment
#    TEXT    #888888   bar text, path
#    INK     #000000   dark text on bright segments
#  Status bar background is "default" so kitty transparency shows.
#
#  Arrows are Nerd Font glyphs:   (right)   (left)
# ─────────────────────────────────────────────────────────────

# Pane borders (with a label on top of each pane)
set -g pane-border-style "fg=#6b6b6b"
set -g pane-active-border-style "fg=#f5f5f5"
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#f5f5f5 bg=default]#[fg=#000000 bg=#f5f5f5 bold] #{pane_index}-#{pane_current_command} #[fg=#f5f5f5 bg=default],#[fg=#8a8a8a bg=default]  #{pane_index}-#{pane_current_command} }"
# Dim inactive panes slightly
setw -g window-style "fg=#888888"
setw -g window-active-style "fg=#c1c1c1"

# Status bar
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#888888"

# Left: session pill  → arrow → arrow → window list
set -g status-left-length 60
set -g status-left "#[bg=#e78a53,fg=#000000,bold]  #{session_name} #[bg=#fbcb97,fg=#e78a53]#[bg=#222222,fg=#fbcb97]"

# Windows
setw -g window-status-separator ""
setw -g window-status-style "bg=#222222,fg=#999999"
setw -g window-status-format "#[bg=#222222,fg=#999999] #{window_index}-#{window_name} #{?#{==:#{window_index},#{session_windows}},#[bg=default fg=#222222],}"
setw -g window-status-current-style "bg=#c1c1c1,fg=#000000,bold"
setw -g window-status-current-format "#[bg=#c1c1c1,fg=#222222]#[fg=#000000,bold] #{window_index}-#{window_name}#{?window_zoomed_flag, 󰁌,} #[bg=#222222,fg=#c1c1c1]#{?#{==:#{window_index},#{session_windows}},#[bg=default fg=#222222],}"
setw -g window-status-activity-style "bg=#222222,fg=#5f8787"
setw -g window-status-bell-style "bg=#222222,fg=#5f8787,bold"

# Right: prefix flag, path, user, host, clock (arrows point left)
set -g status-right-length 500
set -g status-right "#{?client_prefix,#[bg=default fg=#5f8787]#[bg=#5f8787 fg=#000000 bold]  PREFIX #[bg=default fg=#5f8787] ,}#[bg=default,fg=#888888] #{b:pane_current_path} #[bg=default,fg=#222222]#[bg=#222222,fg=#999999]  #(whoami) #[bg=#222222,fg=#999999]#[bg=#999999,fg=#000000]  #{host_short} #[bg=#999999,fg=#fbcb97]#[bg=#fbcb97,fg=#e78a53]#[bg=#e78a53,fg=#000000,bold]  %H:%M "

# Messages & prompts
set -g message-style "fg=#000000,bg=#e78a53,bold"
set -g message-command-style "fg=#000000,bg=#c1c1c1,bold"

# Copy mode / selection
setw -g mode-style "fg=#000000,bg=#e78a53"

